<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CampusPilot AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a flight-deck app shell. A left rail holds the instruments (views), the page is a calm panel of gauges and routes, and signal orange marks only what needs attention. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7ECE9; --ink:#10201C; --ink-2:#51625D; --line:#D3DCD8;
  --accent:#0E6B62; --on-accent:#FFFFFF; --accent-soft:#D9EEEA; --signal:#D94E24; --signal-soft:#FBE3DA;
  --good:#23824F; --warn:#9A6A06; --bad:#C13B36; --good-soft:#DCF0E4; --warn-soft:#F6EAC9; --bad-soft:#F7DCDA;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#14201D; --surface-2:#1B2B27; --ink:#E5EFEB; --ink-2:#9CB2AB; --line:#263833;
    --accent:#45C7B6; --on-accent:#06201C; --accent-soft:#15332F; --signal:#FF8052; --signal-soft:#3A2119;
    --good:#4CC38A; --warn:#E3B341; --bad:#F0716C; --good-soft:#163527; --warn-soft:#38300F; --bad-soft:#3B1A19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#14201D; --surface-2:#1B2B27; --ink:#E5EFEB; --ink-2:#9CB2AB; --line:#263833;
  --accent:#45C7B6; --on-accent:#06201C; --accent-soft:#15332F; --signal:#FF8052; --signal-soft:#3A2119;
  --good:#4CC38A; --warn:#E3B341; --bad:#F0716C; --good-soft:#163527; --warn-soft:#38300F; --bad-soft:#3B1A19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; letter-spacing:-0.01em; line-height:1.15; margin:0; text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); font-weight:600}

/* shell */
.shell{max-width:1240px; margin:0 auto; padding-block:16px 40px; display:grid; gap:20px; grid-template-columns:1fr}
@media (min-width:920px){ .shell{grid-template-columns:232px minmax(0,1fr); align-items:start} }
.topbar{grid-column:1/-1; display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.mark{width:40px; height:40px; border-radius:11px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; flex:none}
.brand h1{font-size:22px}
.brand small{display:block; color:var(--ink-2); font-size:12.5px; line-height:1.3}
.tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:500; font-size:13.5px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.iconbtn{border:1px solid var(--line); background:var(--surface); width:36px; height:36px; border-radius:10px; display:grid; place-items:center; cursor:pointer; color:var(--ink)}

.nav{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.nav button{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:500; color:var(--ink-2); white-space:nowrap; text-align:left}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent); color:var(--on-accent)}
.nav .count{margin-left:auto; background:var(--signal); color:#fff; font-size:11.5px; border-radius:99px; padding:0 7px; font-family:var(--f-mono)}
@media (min-width:920px){
  .nav{flex-direction:column; position:sticky; top:16px; overflow:visible}
  .nav button{width:100%}
  .navnote{display:block}
}
.navnote{display:none; margin-top:16px; padding:12px; border-radius:10px; background:var(--surface-2); color:var(--ink-2); font-size:12.5px}

main{min-width:0; display:grid; gap:18px}
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.pagehead h2{font-size:28px}
.pagehead p{color:var(--ink-2); max-width:62ch; margin-top:4px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; min-width:0}
.card h3{font-size:18px; margin-bottom:4px}
.card .sub{color:var(--ink-2); font-size:13.5px; margin-bottom:14px}
.grid2{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid3{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.hero{display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); align-items:center}

.badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; padding:3px 9px; border-radius:99px; border:1px dashed var(--signal); color:var(--signal); text-transform:uppercase}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.sig{background:var(--signal-soft); color:var(--signal)}
.pill.acc{background:var(--accent-soft); color:var(--accent)}

.btn{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.field{display:grid; gap:6px}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
input[type=text],select,textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px}
textarea{resize:vertical; min-height:120px; line-height:1.5}
input[type=range]{width:100%; accent-color:var(--accent)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row.sp{justify-content:space-between}

/* gauge + stats */
.gaugewrap{max-width:300px; margin-inline:auto; width:100%}
.gauge text{fill:var(--ink)}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.stat{padding:14px 12px; border-radius:12px; background:var(--surface-2)}
.stat b{display:block; font-family:var(--f-mono); font-size:26px; font-weight:500; line-height:1.1}
.stat span{font-size:12.5px; color:var(--ink-2); line-height:1.3; display:block; margin-top:4px}
.stat.sig b{color:var(--signal)}
@media (max-width:560px){.stat b{font-size:19px; white-space:nowrap}.stat{padding:12px 10px}}

/* skill rows */
.srows{display:grid; gap:12px}
.srow{display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr) 62px; gap:12px; align-items:center}
.sname{font-weight:500; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.strack{position:relative; height:10px; border-radius:6px; background:var(--surface-2); background-image:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--line) calc(20% - 1px) 20%)}
.sfill{position:absolute; inset:0 auto 0 0; border-radius:6px; background:var(--accent)}
.srow.ok .sfill{background:var(--good)}
.smark{position:absolute; top:-5px; bottom:-5px; width:3px; margin-left:-1.5px; background:var(--ink); border-radius:2px}
.sval{font-family:var(--f-mono); font-size:13px; text-align:right; color:var(--ink-2)}
@media (max-width:560px){ .srow{grid-template-columns:minmax(0,1fr) 54px} .srow .strack{grid-column:1/-1; grid-row:2} }
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-top:14px}
.legend i{display:inline-block; width:14px; height:8px; border-radius:4px; background:var(--accent); margin-right:6px}
.legend b{display:inline-block; width:3px; height:12px; background:var(--ink); margin-right:6px; vertical-align:-2px}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--accent-soft)}
.minibar{display:inline-block; width:80px; height:7px; border-radius:4px; background:var(--surface-2); vertical-align:middle; margin-right:8px; overflow:hidden}
.minibar i{display:block; height:100%; border-radius:4px}

/* roadmap */
.route{display:grid; gap:0; position:relative}
.stop{display:grid; grid-template-columns:36px minmax(0,1fr); gap:14px; padding-bottom:18px; position:relative}
.stop:last-child{padding-bottom:0}
.stop::before{content:""; position:absolute; left:17px; top:36px; bottom:0; width:2px; background:repeating-linear-gradient(var(--line) 0 5px,transparent 5px 9px)}
.stop:last-child::before{display:none}
.wp{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-mono); font-weight:500; background:var(--surface-2); color:var(--ink); border:2px solid var(--line); z-index:1}
.stop.first .wp{background:var(--signal); border-color:var(--signal); color:#fff}
.stopbody{min-width:0}
.stopbody h4{font-size:17px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{font-size:12.5px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.chip.btnlike{cursor:pointer}
.chip.btnlike:hover{border-color:var(--accent); color:var(--ink)}
.task{margin-top:8px; font-size:14px}

/* detected skills */
.found{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.fskill{border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; gap:4px}
.fskill .top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.fskill b{font-weight:600}
.fskill .maps{font-size:12px; color:var(--ink-2); overflow-wrap:anywhere}
.lvl{font-family:var(--f-mono); font-size:12.5px}

/* chat */
.chatcard{display:flex; flex-direction:column; padding:0; overflow:hidden}
.chathead{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center}
.msgs{padding:18px 20px; display:grid; gap:14px; max-height:min(58vh,560px); min-height:280px; overflow-y:auto; align-content:start}
.msg{max-width:min(100%,640px); min-width:0}
.msg.user{justify-self:end}
.bubble{padding:10px 14px; border-radius:14px; overflow-wrap:anywhere}
.msg.user .bubble{background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--surface-2); border-bottom-left-radius:4px}
.msg.human .bubble{background:var(--signal-soft); border-bottom-left-radius:4px}
.route-tag{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:5px; font-size:12px; color:var(--ink-2)}
.srcs{display:grid; gap:6px; margin-top:10px}
details.src{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:6px 10px; font-size:13px}
details.src summary{cursor:pointer; list-style:none; display:flex; gap:8px; align-items:center}
details.src summary::-webkit-details-marker{display:none}
details.src p{margin-top:6px; color:var(--ink-2); font-size:13px}
.conf{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.conf i{display:inline-block; width:46px; height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden}
.conf i b{display:block; height:100%; background:var(--good)}
.feedback{display:flex; gap:6px; margin-top:8px; align-items:center; font-size:12px; color:var(--ink-2)}
.feedback button{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:2px 8px; cursor:pointer}
.feedback button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.composer{border-top:1px solid var(--line); padding:14px 20px; display:grid; gap:10px}
.composer .row{flex-wrap:nowrap}
.typing{display:inline-flex; gap:4px; padding:4px 0}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--ink-2); animation:blink 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* misc */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:30; max-width:calc(100vw - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.divider{height:1px; background:var(--line); border:0; margin:16px 0}
.list{display:grid; gap:0}
.list > div{padding:12px 0; border-bottom:1px solid var(--line); display:grid; gap:4px}
.list > div:last-child{border-bottom:0}
.hist{width:100%; height:auto; display:block}
.hist text{fill:var(--ink-2); font-family:var(--f-mono); font-size:10px}
.bars{display:grid; gap:10px}
.hbar{display:grid; grid-template-columns:minmax(110px,170px) minmax(0,1fr) 34px; gap:10px; align-items:center; font-size:13.5px}
.hbar .t{height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden}
.hbar .t i{display:block; height:100%; background:var(--accent); border-radius:6px}
.hbar .v{font-family:var(--f-mono); text-align:right; color:var(--ink-2)}
.cols{display:flex; gap:8px; align-items:flex-end; height:140px; padding-top:6px}
.col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; min-width:0}
.col i{display:block; width:100%; border-radius:6px 6px 2px 2px; background:var(--accent); min-height:3px}
.col span{font-family:var(--f-mono); font-size:11px; color:var(--ink-2)}
.col em{font-style:normal; font-family:var(--f-mono); font-size:11px}
.formula{font-family:var(--f-mono); background:var(--surface-2); border-radius:10px; padding:10px 14px; font-size:13.5px; overflow-x:auto; white-space:nowrap}
.pipeline{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); counter-reset:p}
.pipeline > div{border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--surface)}
.pipeline b{display:block; font-family:var(--f-display); margin-bottom:2px}
.pipeline span{font-size:13px; color:var(--ink-2)}
.empty{padding:24px; text-align:center; color:var(--ink-2); border:1px dashed var(--line); border-radius:12px}
footer{grid-column:1/-1; color:var(--ink-2); font-size:12.5px; border-top:1px solid var(--line); padding-top:14px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
//#LOGIC_START
/* ---------- Taxonomy: skills, synonyms, resources ---------- */
const SKILLS = {
  sql:{name:'SQL', syn:['sql','mysql','postgresql','postgres','sqlite','t-sql','pl/sql','window functions'],
    res:['Kaggle Learn: Intro to SQL','Mode SQL Tutorial'], task:'Answer 10 business questions on a sample sales database using JOIN, GROUP BY and window functions.'},
  python:{name:'Python', syn:['python'], res:['Kaggle Learn: Python','CS50P (Harvard, free)'], task:'Solve 20 practice problems, then build a small command-line tool.'},
  prog:{name:'Core programming', syn:['java','c++','c#','python','kotlin','golang','c programming'], res:['NPTEL programming courses','HackerRank language tracks'], task:'Implement a library-management console app from scratch.'},
  dsa:{name:'Data structures & algorithms', syn:['data structures','dsa','algorithms','leetcode','competitive programming','codechef','codeforces'], res:['NPTEL: Data Structures and Algorithms','LeetCode Top Interview 150'], task:'Solve three problems a week across arrays, trees and graphs, and explain each one aloud.'},
  oop:{name:'Object-oriented design', syn:['oop','object-oriented','object oriented','design patterns'], res:['NPTEL: Object-oriented programming','Refactoring Guru: design patterns'], task:'Model a campus-event system with classes, interfaces and two design patterns.'},
  dbms:{name:'Database systems', syn:['dbms','database management','normalization','normalisation','mongodb','database design','rdbms'], res:['NPTEL: Database Management System','GeeksforGeeks DBMS notes'], task:'Normalise a sample schema to 3NF and write the transactions it needs.'},
  os:{name:'Operating systems', syn:['operating system','operating systems'], res:['NPTEL: Operating Systems','OSTEP (free textbook)'], task:'Write notes on scheduling, deadlock and paging with one worked example each.'},
  network:{name:'Computer networks', syn:['computer networks','computer networking','networking','tcp/ip','tcp','ccna'], res:['NPTEL: Computer Networks','Cisco Networking Academy intro courses'], task:'Trace one HTTP request end to end in Wireshark and describe each layer.'},
  git:{name:'Git & version control', syn:['git','github','gitlab','version control'], res:['Pro Git book (free)','GitHub Skills'], task:'Send a pull request to a classmate repository and resolve one merge conflict.'},
  linux:{name:'Linux & shell', syn:['linux','ubuntu','bash','shell scripting'], res:['Linux Journey','OverTheWire: Bandit'], task:'Automate a backup with a shell script and a cron job.'},
  docker:{name:'Docker & containers', syn:['docker','kubernetes','containers','containerization','containerisation'], res:['Docker Get Started guide','Play with Docker'], task:'Containerise a two-service app with Docker Compose.'},
  cicd:{name:'CI/CD pipelines', syn:['ci/cd','jenkins','github actions','gitlab ci','pipeline'], res:['GitHub Actions documentation','Jenkins user handbook'], task:'Create a pipeline that tests, builds and deploys a sample app on every push.'},
  cloud:{name:'Cloud platforms', syn:['aws','azure','gcp','google cloud','cloud computing','ec2'], res:['AWS Cloud Practitioner Essentials','Microsoft Learn: Azure Fundamentals'], task:'Deploy a static site and a small API on a free-tier cloud account.'},
  html:{name:'HTML & CSS', syn:['html','css','html5','css3','bootstrap','tailwind'], res:['MDN: Learn web development','freeCodeCamp: Responsive Web Design'], task:'Build a responsive three-page site without a framework.'},
  js:{name:'JavaScript', syn:['javascript','typescript','es6','ajax'], res:['javascript.info','freeCodeCamp: JavaScript Algorithms'], task:'Build a to-do app that uses fetch calls and DOM updates.'},
  react:{name:'React', syn:['react','react.js','reactjs','next.js','redux'], res:['react.dev documentation','Scrimba: Learn React'], task:'Build a multi-page dashboard with routing and shared state.'},
  node:{name:'Node.js & backend', syn:['node.js','nodejs','express','backend development','spring boot','django','flask','fastapi'], res:['Node.js official guides','The Odin Project: NodeJS'], task:'Build an authenticated notes API backed by a database.'},
  rest:{name:'REST APIs', syn:['rest api','rest apis','restful','api development','postman'], res:['MDN: HTTP overview','Postman Learning Center'], task:'Design and document a REST API with a Postman collection.'},
  stats:{name:'Statistics', syn:['statistics','statistical','hypothesis testing','probability','regression analysis','a/b testing'], res:['Khan Academy: Statistics and probability','NPTEL: Probability and Statistics'], task:'Run a hypothesis test and a regression on a public dataset and explain the result in plain language.'},

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MOD_LO = /\b(basic|basics|beginner|familiar|familiarity|exposure|learning|introductory)\b/;
const CTX = /\b(built|developed|designed|created|implemented|deployed|led|analysed|analyzed|intern|internship|project|worked|automated|trained|published)\b/;

function extractSkills(text){
  const sentences = String(text).toLowerCase().split(/(?<=[.!?])\s+|\n+/).filter(Boolean);
  const found = {};
  for (const [id, sk] of Object.entries(SKILLS)) {
    let count = 0, mod = false, low = false, ctx = false; const via = new Set();
    for (const sy of sk.syn) {
      const re = new RegExp('(?<![a-z0-9+#.])' + rxEsc(sy) + '(?![a-z0-9+#])', 'g');
      for (const s of sentences) {
        const m = s.match(re);
        if (!m) continue;
        count += m.length; via.add(sy);
        if (MOD_HI.test(s)) mod = true;
        if (MOD_LO.test(s)) low = true;
        if (CTX.test(s)) ctx = true;

    if (!count) continue;
    let lv = 1 + (count >= 2 ? 1 : 0) + (count >= 4 ? 1 : 0) + (mod ? 1 : 0) + (ctx ? 1 : 0);
    if (low) lv = Math.min(lv, 2);
    found[id] = {level: Math.min(5, lv), mentions: count, via: [...via]};

}
function readiness(roleId, levels){

    num += k.w * f; den += k.w;
    return {id:k.id, name:SKILLS[k.id].name, w:k.w, s, t:k.t, f, gap, pr:k.w * gap};
  });
  const raw = 100 * num / den;

  return {score:Math.round(raw), raw, rows, atTarget:rows.filter(r => r.s >= r.t).length, below:rows.filter(r => r.s < r.t).length,

}

    avail.sort((a,b) => b.pr - a.pr || b.w - a.w);
    const n = avail.shift(); order.push(n);
    gaps.forEach(g => { if ((PREREQ[g.id] || []).includes(n.id) && --indeg[g.id] === 0) avail.push(g); });

const CONF_MIN = 0.45;

let INDEX = {chunks:[], df:{}, N:0, avgdl:1};
function buildIndex(docs){
  const chunks = [];
  docs.forEach(d => d.sections.forEach(([sec, text]) => {
    const t = tok(sec + ' ' + text); const tf = {};
    t.forEach(w => tf[w] = (tf[w] || 0) + 1);
    chunks.push({docId:d.id, title:d.title, sec, text, len:t.length, tf});
  }));
  const df = {}; chunks.forEach(c => Object.keys(c.tf).forEach(w => df[w] = (df[w] || 0) + 1));
  const N = chunks.length; INDEX = {chunks, df, N, avgdl: chunks.reduce((a,c) => a + c.len, 0) / Math.max(N,1) || 1};
}
function idf(w){ const n = INDEX.df[w] || 0; return Math.log(1 + (INDEX.N - n + 0.5) / (n + 0.5)); }
function searchCampus(q, k = 3){
  const qt = [...new Set(tok(normQuery(q)))];
  if (!qt.length || !INDEX.N) return {hits:[], conf:0, qt};
  const k1 = 1.5, b = 0.75, totalIdf = qt.reduce((a,w) => a + idf(w), 0) || 1;
  const scored = INDEX.chunks.map(c => {
    let sc = 0, cov = 0;
    qt.forEach(w => { const f = c.tf[w]; if (!f) return; const i = idf(w); cov += i;
      sc += i * (f * (k1 + 1)) / (f + k1 * (1 - b + b * c.len / INDEX.avgdl)); });
    return {chunk:c, score:sc, cov:cov / totalIdf};
  }).filter(h => h.score > 0).sort((a,b2) => b2.score - a.score);
  const hits = scored.slice(0, k);
  return {hits, conf: hits.length ? Math.min(1, hits[0].cov) : 0, qt};
}

function answerCampus(q){
  const r = searchCampus(q);
  if (!r.hits.length || r.conf < CONF_MIN) return {ok:false, conf:r.conf, hits:r.hits};
  const qs = new Set(r.qt), picks = [], used = [];
  const top = r.hits[0];
  const scoredS = sentences(top.chunk.text).map((s, i) => ({s, i, v: tok(s).filter(w => qs.has(w)).length}));
  const best = [...scoredS].sort((a,b) => b.v - a.v || a.i - b.i).filter(x => x.v > 0).slice(0, 2).sort((a,b) => a.i - b.i);
  const first = (best.length ? best : scoredS.slice(0,1)).map(x => x.s).join(' ');
  picks.push(first + ' [1]'); used.push(top);
  const second = r.hits.find(h => h.chunk.docId !== top.chunk.docId && h.cov >= CONF_MIN && h.score >= 0.6 * top.score);

    const ss = sentences(second.chunk.text).map(s => ({s, v: tok(s).filter(w => qs.has(w)).length})).sort((a,b) => b.v - a.v)[0];
    if (ss && ss.v > 0) { picks.push(ss.s + ' [2]'); used.push(second); }
  }

}
function runSelfTest(k = 3){
  let hit = 0, rr = 0; const rows = [];

}

const CAREER_RX = /\b(skill|skills|role|resume|cv|roadmap|readiness|ready|gap|gaps|interview|learn|improve|career|job|score|missing|lack|certif\w*|analyst|scientist|developer|devops|prepare|preparation|study|plan)\b/g;

  const s = q.toLowerCase(), c = (s.match(CAREER_RX) || []).length, m = (s.match(CAMPUS_RX) || []).length;
  if (/\b(my (skills?|score|gaps?|readiness|roadmap|resume|profile)|which role|best role|am i ready)\b/.test(s)) return 'career';
  return c > m ? 'career' : 'campus';
}
function findRole(q, fallback){
  const s = q.toLowerCase();
  for (const [id, r] of Object.entries(ROLES)) if (r.alias.some(a => new RegExp('\\b' + rxEsc(a) + '\\b').test(s))) return id;
  return fallback;
}
function answerCareer(q, S){
  const s = q.toLowerCase(), roleId = findRole(q, S.target), role = ROLES[roleId], rd = readiness(roleId, S.levels);

    const f = roleFit(S.levels);
    return {text:'Your closest role fit is ' + f[0].name + ' at ' + f[0].score + '/100, followed by ' + f.slice(1,3).map(x => x.name + ' (' + x.score + ')').join(' and ') + '. [Source: role profiles]', sources:src, conf:.9};

}

function gauge(score){
  const R = 86, cx = 110, cy = 104, col = score >= 75 ? 'var(--good)' : score >= 50 ? 'var(--warn)' : 'var(--bad)';
  let ticks = '';
  for (let i = 0; i <= 20; i++) {
    const a = Math.PI * (1 - i / 20), major = i % 5 === 0, r1 = R + 10, r2 = R + (major ? 20 : 15);
    const ready = i === 15;
    ticks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy - r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy - r2 * Math.sin(a)).toFixed(1)}" stroke="${ready ? 'var(--signal)' : 'var(--line)'}" stroke-width="${major ? 2.2 : 1.4}" stroke-linecap="round"/>`;
  }
  const a75 = Math.PI * (1 - .75), lx = cx + (R + 31) * Math.cos(a75), ly = cy - (R + 31) * Math.sin(a75);
  const arc = `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`;
  return `<svg class="gauge" viewBox="0 0 220 138" role="img" aria-label="Readiness score ${score} out of 100">
    ${ticks}
    <path d="${arc}" fill="none" stroke="var(--surface-2)" stroke-width="14" stroke-linecap="round"/>
    ${score > 0 ? `<path d="${arc}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100"/>` : ''}
    <text x="${lx.toFixed(1)}" y="${(ly - 2).toFixed(1)}" text-anchor="middle" font-size="9" style="fill:var(--signal);font-family:var(--f-mono)">75</text>
    <text x="${cx}" y="${cy - 16}" text-anchor="middle" font-size="40" style="font-family:var(--f-mono);font-weight:500">${score}</text>
    <text x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="11" style="fill:var(--ink-2);font-family:var(--f-mono);letter-spacing:.08em">OUT OF 100</text>
    <text x="${cx - R}" y="${cy + 20}" text-anchor="middle" font-size="9" style="fill:var(--ink-2);font-family:var(--f-mono)">0</text>
    <text x="${cx + R}" y="${cy + 20}" text-anchor="middle" font-size="9" style="fill:var(--ink-2);font-family:var(--f-mono)">100</text>
  </svg>`;
}
function skillRows(rows){

function sparkline(h){
  const W = 320, H = 110, px = 28, py = 16, n = h.length;
  const x = i => px + (n === 1 ? (W - 2 * px) / 2 : i * (W - 2 * px) / (n - 1)), y = v => H - py - (v / 100) * (H - 2 * py - 6);
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p.s).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${H - py} ${pts} ${x(n - 1).toFixed(1)},${H - py}`;
  const grid = [0, 50, 100].map(v => `<line x1="${px}" x2="${W - 8}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${v === 50 ? 'stroke-dasharray="3 4"' : ''}/><text x="${px - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const last = h[n - 1];
  const dl = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short'});
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness score over time, latest ${last.s}">
    ${grid}<polygon points="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${h.map((p, i) => i < n - 1 ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.s).toFixed(1)}" r="2.8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>` : '').join('')}
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(last.s).toFixed(1)}" r="5" fill="var(--signal)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(n - 1).toFixed(1)}" y="${(y(last.s) - 10).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-size:11px">${last.s}</text>
    <text x="${x(0)}" y="${H - 2}" text-anchor="start">${dl(h[0].d)}</text><text x="${x(n - 1)}" y="${H - 2}" text-anchor="end">${dl(last.d)}</text>
  </svg>`;
}

let toastTimer;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3200); }
function go(v){ S.view = v; save(); render(); window.scrollTo(0, 0); }

/* ---------- Behaviour ---------- */
function pushHistory(){ const d = new Date().toISOString().slice(0, 10), s = readiness(S.target, S.levels).score, last = S.history[S.history.length - 1];
  if (last && last.d === d) last.s = s; else S.history.push({d, s}); if (S.history.length > 24) S.history.shift(); }
function recordAnswer(res, ms){ const M = T.M; M.answers++; M.lat.push(ms); if (res.sources && res.sources.length) M.grounded++; if (res.escalated) M.escalated++; }
function ask(q){
  q = q.trim(); if (!q) return;
  T.chat.push({id:Date.now(), role:'user', text:q}); T.typing = true; if (S.view !== 'chat') S.view = 'chat'; render();
  setTimeout(() => {
    const t0 = performance.now(), route = routeQuestion(q); let msg;
    if (route === 'career') { const r = answerCareer(q, S); msg = {role:'bot', route:'career', text:r.text, sources:r.sources, conf:r.conf}; }
    else { const r = answerCampus(q);
      if (r.ok) msg = {role:'bot', route:'campus', text:r.text, sources:r.sources, conf:r.conf};
      else { T.queue.unshift({id:Date.now(), who:S.name, q, at:'Just now', status:'open', reply:''});
        msg = {role:'bot', route:'campus', text:'I could not find a reliable answer in the campus documents, so I have sent your question to the review queue. A staff member will reply here.', conf:r.conf, escalated:true, sources:[]}; } }
    msg.id = Date.now() + 1; T.chat.push(msg); recordAnswer(msg, performance.now() - t0); T.typing = false; render();
  }, 450);
}
function askCampusInline(q){
  q = q.trim(); T.campusQ = q; if (!q) return;
  const t0 = performance.now(), r = answerCampus(q);
  if (!r.ok) T.queue.unshift({id:Date.now(), who:S.name, q, at:'Just now', status:'open', reply:''});
  T.campusAns = r; recordAnswer({sources:r.ok ? r.sources : [], escalated:!r.ok}, performance.now() - t0); render();
}
function analyse(){
  const found = extractSkills(S.resume); T.found = found;
  const lv = {}; Object.entries(found).forEach(([id, f]) => lv[id] = f.level);
  S.levels = lv; S.isSample = S.resume === SAMPLE_RESUME ? S.isSample : false;
  S.history = S.isSample ? S.history : [{d:new Date().toISOString().slice(0, 10), s:readiness(S.target, lv).score}];
  if (S.isSample) pushHistory(); save(); render();
  toast(Object.keys(found).length + ' skills found. Readiness for ' + ROLES[S.target].name + ': ' + readiness(S.target, lv).score + '/100');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-nav],[data-role],[data-ask],[data-campus],[data-fb],[data-student]'); if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; S.view = FIRST[d.role]; save(); render(); return; }
  if (d.nav) return go(d.nav);
  if (d.ask) return ask(d.ask);
  if (d.campus) { T.campusQ = d.campus; return askCampusInline(d.campus); }
  if (d.fb) { const m = T.chat.find(x => String(x.id) === d.id); if (m && !m.fb) { m.fb = d.fb; T.M[d.fb]++; render(); } return; }
  if (d.student) { T.selStudent = d.student; return render(); }
  switch (d.act) {
    case 'theme': { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
      S.theme = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', S.theme); save(); break; }
    case 'analyse': return analyse();
    case 'loadSample': S.resume = SAMPLE_RESUME; S.name = 'Priya S'; S.levels = {...SAMPLE_LEVELS}; S.isSample = true; S.history = SAMPLE_HISTORY.map(x => ({...x})); T.found = extractSkills(SAMPLE_RESUME); save(); render(); toast('Sample resume loaded'); return;
    case 'done': { const id = d.id, k = ROLES[S.target].skills.find(x => x.id === id), before = readiness(S.target, S.levels).score;
      S.levels[id] = Math.min(k.t, (S.levels[id] || 0) + 1); pushHistory(); save(); render();
      toast(SKILLS[id].name + ' is now level ' + S.levels[id] + '. Readiness ' + before + ' to ' + readiness(S.target, S.levels).score); return; }
    case 'clearChat': T.chat = T.chat.slice(0, 1); return render();
    case 'saveNote': { const el = document.getElementById('noteTxt'); S.notes[el.dataset.who] = el.value; save(); return toast('Note saved'); }
    case 'reply': { const q = T.queue.find(x => String(x.id) === d.id), el = document.getElementById('rep_' + d.id);
      if (!q || !el.value.trim()) return toast('Type a reply first');
      q.status = 'answered'; q.reply = el.value.trim(); T.chat.push({id:Date.now(), role:'human', text:q.reply}); render(); return toast('Reply sent to the student'); }
    case 'selfTest': T.selfTest = runSelfTest(3); return render();
    case 'addDoc': {
      const title = document.getElementById('docTitle').value.trim(), text = document.getElementById('docText').value.trim();
      if (!title || !text) return toast('Add a title and some text first');
      const secs = []; let cur = ['Overview', []];
      text.split(/\n+/).forEach(line => { const m = line.match(/^([A-Z][^:.]{2,60}):\s*(.*)$/);
        if (m && !m[2]) { if (cur[1].length) secs.push([cur[0], cur[1].join(' ')]); cur = [m[1], []]; } else if (line.trim()) cur[1].push(line.trim()); });
      if (cur[1].length) secs.push([cur[0], cur[1].join(' ')]);
      S.userDocs.push({id:'u' + Date.now(), user:true, title, date:new Date().toISOString().slice(0, 10), owner:'Added by placement cell', sections:secs}); save(); reindex(); render(); return toast('Added. ' + secs.length + ' passages indexed'); }
    case 'delDoc': S.userDocs = S.userDocs.filter(x => x.id !== d.id); save(); reindex(); return render();
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-student]')) { e.preventDefault(); T.selStudent = e.target.dataset.student; render(); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'chat') { const el = document.getElementById('chatIn'), v = el.value; el.value = ''; ask(v); }
  if (f === 'quick') ask(document.getElementById('quickQ').value);
  if (f === 'campus') askCampusInline(document.getElementById('campusQ').value);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'resume') S.resume = t.value;
  else if (t.dataset.input === 'name') { S.name = t.value || 'Student'; }
  else if (t.dataset.range) { const o = document.getElementById('out_' + t.dataset.range), v = +t.value; o.textContent = v + ' · ' + LEVEL_WORDS[v] + ' (target ' + t.dataset.t + ')'; }
  if (t.dataset.input) save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.range) { S.levels[t.dataset.range] = +t.value; S.isSample = false; pushHistory(); save(); render(); }
  else if (t.dataset.change === 'role') { S.target = t.value; save(); render(); }
  else if (t.dataset.change === 'fRole') { T.filterRole = t.value; render(); }
  else if (t.dataset.change === 'fStat') { T.cohortFilter = t.value; render(); }
  else if (t.dataset.change === 'fSort') { T.sortBy = t.value; render(); }
  else if (t.id === 'resumeFile' || t.id === 'docFile') {
    const f = t.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { if (t.id === 'resumeFile') { S.resume = String(rd.result); save(); render(); toast('Resume loaded. Choose Analyse resume.'); }
      else { document.getElementById('docText').value = String(rd.result); const ti = document.getElementById('docTitle'); if (!ti.value) ti.value = f.name.replace(/\.[^.]+$/, ''); toast('File loaded. Review it, then add it.'); } };
    rd.readAsText(f);
  }
});

T.found = extractSkills(SAMPLE_RESUME);
render();
</script>
